name: Import Instagram media
on:
  schedule:
    - cron: '17 04 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: instagram-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-instagram.mjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      # Stage PRIMA del diff: i nuovi eventi sono file non tracciati e
      # `git diff --quiet` (solo tracked) non li vedrebbe mai — il bot non
      # avrebbe mai committato un post nuovo. Dopo il push, il dispatch esplicito
      # del deploy serve perché un push con GITHUB_TOKEN NON triggera altri
      # workflow (workflow_dispatch è l'unica eccezione ammessa).
      - run: |
          git add app/public/photos
          git diff --cached --quiet || (
            git config user.name 'portfolio-sync[bot]'
            git config user.email 'portfolio-sync[bot]@users.noreply.github.com'
            git commit -m 'chore: import Instagram media'
            git push
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          )
        env:
          GH_TOKEN: ${{ github.token }}
